name: Build Sad Traders APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q "SadTraders-Android-GitHub-Build.zip" -d android-project

      - name: Inspect extracted project
        run: |
          echo "=== Extracted files ==="
          find android-project -maxdepth 5 -type f | head -200
          echo "=== Gradle files ==="
          find android-project -type f \( -name "gradlew" -o -name "build.gradle" -o -name "settings.gradle" \) -print

      - name: Find Gradle project
        run: |
          GRADLEW=$(find android-project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "The ZIP may not contain the Gradle wrapper."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found:"
          echo "$GRADLEW"
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sad-Traders-Customer-App
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
